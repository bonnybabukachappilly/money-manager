[project]
name = "backend"
version = "0.1.0"
authors = [
    { name = "bonnybabukachappilly", email = "bonnybabukachappilly@gmail.com" },
]
requires-python = ">= 3.12"


dependencies = [
    "alembic>=1.18.4,<2",
    "apscheduler>=3.11.2,<4",
    "asyncpg>=0.31.0,<0.32",
    "bcrypt>=5.0.0,<6",
    "fastapi>=0.135.3,<0.136",
    "pydantic-settings>=2.13.1,<3",
    "pydantic[email]>=2.12.5,<3",
    "python-jose>=3.5.0,<4",
    "python-multipart>=0.0.24,<0.0.25",
    "slowapi>=0.1.9,<0.2",
    "sqlalchemy>=2.0.49,<3",
    "uvicorn[standard]>=0.44.0,<0.45",
]

[tool.pixi.activation]
scripts = ["scripts/load_env.sh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]


[tool.pixi.dependencies]
python = "3.12.*"
postgresql = ">=18.3,<19"

[tool.pixi.pypi-dependencies]
backend = { path = ".", editable = true }

[tool.pixi.tasks]
dev = "PYTHONPATH=src uvicorn app.main:app --reload --port 8080"
migrate = "PYTHONPATH=src alembic upgrade head"
makemigrations = "PYTHONPATH=src alembic revision --autogenerate -m"
echo-db = "echo $POSTGRES_DB"

[tool.pixi.tasks.db-init]
cmd = "printf %s \"$POSTGRES_PASSWORD\" > pass.txt && initdb -D .pixi/db_data --auth=scram-sha-256 --pwfile=pass.txt && rm pass.txt"

[tool.pixi.tasks.db-start]
cmd = "pg_ctl -D .pixi/db_data -l .pixi/db_log -o '-p 5435' start && sleep 2 && PGPASSWORD=\"$POSTGRES_PASSWORD\" createdb -h localhost -p 5435 -U \"$POSTGRES_USER\" \"$POSTGRES_DB\" || true"

[tool.pixi.tasks.db-stop]
cmd = "pg_ctl -D .pixi/db_data stop"

[tool.pixi.tasks.db-reset]
cmd = "pixi run db-stop || true && rm -rf .pixi/db_data && pixi run db-init && pixi run db-start"

[tool.pixi.tasks.db-clean]
cmd = "rm -f .pixi/db_data/postmaster.pid"
